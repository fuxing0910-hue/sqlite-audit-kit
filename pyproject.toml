[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-audit-kit"
version = "0.1.0"
description = "Read-only SQLite snapshots, data measurements, and offline comparison reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fu Xing"}]
dependencies = []
keywords = ["sqlite", "database", "audit", "cli", "migration", "data-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
sqlite-audit = "sqlite_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["sqlite_audit*"]
