name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_skill.py --check
      - run: python -I -S skills/sqlite-migration-audit/scripts/run.py demo --output-dir skill-smoke
      - run: python -m sqlite_audit.agent_tools --list --provider deepseek
      - run: python -m sqlite_audit demo --output-dir demo-output
      - run: python -m sqlite_audit compare demo-output/before.json demo-output/before.json --json demo-output/unchanged.json --fail-on-regression
      - run: python -m pip install --no-deps .
      - run: sqlite-audit --version
